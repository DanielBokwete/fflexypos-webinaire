<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700-latin.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; font-family: "Inter", sans-serif; color: #ffffff; }
        .cta-card { position: absolute; left: 64px; right: 64px; bottom: 400px; background: #0a192f;
          border: 3px solid #d4af37; border-radius: 28px; padding: 44px 48px 48px; display: flex; flex-direction: column; gap: 18px; }
        .cta-kicker { font-size: 30px; font-weight: 700; letter-spacing: 4px; color: #d4af37; }
        .cta-title { font-size: 76px; line-height: 1.05; font-weight: 700; letter-spacing: -1.5px; }
        .cta-title .y { color: #facc15; }
        .cta-button { margin-top: 14px; align-self: flex-start; background: #facc15; color: #0a192f;
          font-size: 42px; font-weight: 700; padding: 20px 40px; border-radius: 999px; }
      </style>
      <div id="root" data-composition-id="cta" data-width="1080" data-height="1920">
        <div class="cta-card">
          <div class="cta-kicker">SESSION GRATUITE</div>
          <div class="cta-title">Webinaire <span class="y">FflexyPOS</span></div>
          <div class="cta-button">Inscris-toi · lien en bio</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(".cta-card", { opacity: 0, y: 120 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.1);
        tl.fromTo(".cta-button", { scale: 0.8 }, { scale: 1, duration: 0.4, ease: "back.out(2.5)" }, 0.5);
        tl.to(".cta-button", { scale: 1.06, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 3 }, 1.2);
        window.__timelines["cta"] = tl;
      </script>
    </template>
  </body>
</html>
