<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-400-latin.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("assets/fonts/Inter-700-latin.woff2") format("woff2"); font-weight: 700; }
        #root { position: absolute; inset: 0; font-family: "Inter", sans-serif; color: #ffffff; }
        .brand-shade-top { position: absolute; left: 0; right: 0; top: 0; height: 380px;
          background: linear-gradient(180deg, rgba(10,25,47,0.85), rgba(10,25,47,0)); }
        .brand-shade-bottom { position: absolute; left: 0; right: 0; bottom: 0; height: 920px;
          background: linear-gradient(0deg, rgba(10,25,47,0.94) 12%, rgba(10,25,47,0)); }
        .brand-progress { position: absolute; left: 64px; right: 64px; top: 70px; height: 8px;
          border-radius: 4px; background: rgba(255,255,255,0.3); overflow: hidden; }
        .brand-progress-fill { width: 100%; height: 100%; background: #facc15; transform-origin: left center; }
        .brand-tag { position: absolute; top: 110px; left: 64px; display: flex; flex-direction: column; gap: 8px;
          background: rgba(10,25,47,0.88); border-radius: 18px; padding: 18px 28px 20px; }
        .brand-name { font-size: 54px; font-weight: 700; letter-spacing: -1px; }
        .brand-name .y { color: #facc15; }
        .brand-sub { font-size: 24px; font-weight: 400; color: #e2e8f0; letter-spacing: 1px; }
      </style>
      <div id="root" data-composition-id="brand" data-width="1080" data-height="1920">
        <div class="brand-shade-top"></div>
        <div class="brand-shade-bottom"></div>
        <div class="brand-progress"><div class="brand-progress-fill"></div></div>
        <div class="brand-tag">
          <div class="brand-name"><span class="y">Fflexy</span>POS™</div>
          <div class="brand-sub">FacileApp · Groupe ELAKO</div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(".brand-progress-fill", { scaleX: 0 }, { scaleX: 1, duration: 10, ease: "none" }, 0);
        tl.fromTo(".brand-tag", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
        window.__timelines["brand"] = tl;
      </script>
    </template>
  </body>
</html>
