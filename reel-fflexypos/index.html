<!doctype html>
<html lang="fr" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      #aroll-frame,
      #aroll-zoom {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      #a-roll {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <!-- A-roll : la vidéo source joue en entier, zoom lent + punch-in sur l'accroche -->
      <div id="aroll-frame">
        <div id="aroll-zoom" data-layout-allow-overflow>
          <video
            id="a-roll"
            class="clip"
            src="assets/video/presentatrice.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="10"
            data-track-index="0"
          ></video>
        </div>
      </div>
      <audio
        id="a-roll-audio"
        src="assets/video/presentatrice.mp4"
        data-start="0"
        data-duration="10"
        data-track-index="5"
        data-volume="1"
      ></audio>

      <!-- Habillage de marque (logo, dégradés, barre de progression) -->
      <div
        id="brand"
        data-composition-id="brand"
        data-composition-src="compositions/brand.html"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scène 1 : accroche -->
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="compositions/hook.html"
        data-start="0"
        data-duration="3"
        data-track-index="2"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scène 2 : avantages -->
      <div
        id="perks"
        data-composition-id="perks"
        data-composition-src="compositions/perks.html"
        data-start="3"
        data-duration="3.6"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>

      <!-- Scène 3 : appel à l'action webinaire -->
      <div
        id="cta"
        data-composition-id="cta"
        data-composition-src="compositions/cta.html"
        data-start="6.6"
        data-duration="3.4"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#aroll-zoom", { scale: 1 }, { scale: 1.08, duration: 10, ease: "none" }, 0);
      tl.fromTo("#aroll-frame", { scale: 1 }, { scale: 1.06, duration: 0.25, ease: "power2.out" }, 0.8);
      tl.to("#aroll-frame", { scale: 1, duration: 0.4, ease: "power2.inOut" }, 2.6);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
